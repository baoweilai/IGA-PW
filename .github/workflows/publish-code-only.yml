name: Publish code-only snapshot

on:
  push:
    branches:
      - main
    paths:
      - code-only.zip

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace repository contents
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name code-only.zip -exec rm -rf -- {} +
          unzip -q code-only.zip -d .
          rm code-only.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish revised code-only repository"
          git push
